<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Dashboard</title>
<style>
:root { --bg:#141414; --panel:#1E1E1E; --line:#2E2E2E; --text:#E8E8E8; --dim:#9A9A9A; --pick:#3DDC6E; --reject:#FF5A5A;
        --alt:#555; --accent:#5AA9FF; --warn:#FFB020; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
header { position:sticky; top:0; z-index:5; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; }
header h1 { font-size:17px; margin:0 12px 0 0; display:inline; }
.sub { color:var(--dim); }
.chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; align-items:center; }
.chip { background:#262626; border:1px solid var(--line); border-radius:12px; padding:2px 10px; font-size:12px; }
.chip b { color:#fff; }
.running { color:var(--warn); }
button, select, input { background:#2A2A2A; color:var(--text); border:1px solid #3A3A3A; border-radius:6px; padding:5px 10px; font:inherit; }
button:hover { border-color:var(--accent); cursor:pointer; }
button.primary { background:#1F4F86; border-color:#2E6DB5; }
nav { display:flex; gap:4px; margin-top:10px; }
nav button.on { background:#3A3A3A; border-color:#666; }
main { padding:12px 16px 60px; }
.toolbar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:10px; }
.toolbar .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
.moment { display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); }
.moment .label { width:92px; flex:none; color:var(--dim); font-size:12px; }
.moment .label b { color:var(--text); display:block; font-size:13px; }
.frames { display:flex; flex-wrap:wrap; gap:8px; }
.frame { width:168px; cursor:pointer; position:relative; }
.frame img { width:168px; height:168px; object-fit:contain; background:#0B0B0B; display:block; border:3px solid transparent; border-radius:3px; }
.frame.pick img { border-color:var(--pick); }
.frame.reject img { border-color:var(--reject); opacity:.6; }
.frame.sel img { outline:2px solid var(--accent); outline-offset:2px; }
.frame .meta { font-size:11px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.frame .hand { position:absolute; top:6px; right:6px; background:var(--accent); color:#000; font-size:10px; border-radius:8px; padding:0 5px; }
.frame .crop { position:absolute; top:6px; left:6px; background:var(--warn); color:#000; font-size:10px; border-radius:8px; padding:0 5px; }
.grid { display:flex; flex-wrap:wrap; gap:10px; }
.grid .frame, .grid .frame img { width:240px; }
.grid .frame img { height:240px; }
#overlay { position:fixed; inset:0; background:#0A0A0A; z-index:20; display:none; }
#overlay.on { display:flex; flex-direction:column; }
#overlay .top { display:flex; gap:10px; align-items:center; padding:10px 16px; }
#overlay .stage { flex:1; display:flex; align-items:center; justify-content:center; min-height:0; }
#overlay .stage img { max-width:96vw; max-height:80vh; }
.badge { padding:2px 8px; border-radius:10px; font-size:12px; }
.badge.pick { background:var(--pick); color:#000; } .badge.reject { background:var(--reject); color:#000; } .badge.alternate { background:#444; }
#crop { position:fixed; inset:0; background:#0A0A0A; z-index:30; display:none; flex-direction:column; align-items:center; }
#crop.on { display:flex; }
#cropbox { position:relative; overflow:hidden; margin:12px; background:#000; }
#cropbox img { position:absolute; left:50%; top:50%; transform-origin:50% 50%; }
#rect { position:absolute; border:2px solid #fff; box-shadow:0 0 0 9999px rgba(0,0,0,.55); cursor:move; }
#rect .handle { position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; background:#fff; cursor:nwse-resize; }
#rect .thirds { position:absolute; inset:0; background:
  linear-gradient(to right, transparent 33.1%, rgba(255,255,255,.35) 33.3%, transparent 33.6%, transparent 66.4%, rgba(255,255,255,.35) 66.6%, transparent 66.9%),
  linear-gradient(to bottom, transparent 33.1%, rgba(255,255,255,.35) 33.3%, transparent 33.6%, transparent 66.4%, rgba(255,255,255,.35) 66.6%, transparent 66.9%); pointer-events:none; }
.panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; }
.panel h2 { font-size:15px; margin:0 0 8px; }
pre { white-space:pre-wrap; background:#101010; padding:12px; border-radius:6px; }
.form { display:grid; grid-template-columns:minmax(80px, 120px) minmax(0, 1fr); gap:8px; max-width:560px; align-items:center; }
.form input, .form select { width:100%; min-width:0; }
body { overflow-x:hidden; }
.hint { color:var(--dim); font-size:12px; }
.keys kbd { background:#333; border-radius:3px; padding:0 4px; font-size:11px; }
.empty { color:var(--dim); padding:40px 0; text-align:center; }
@media (max-width: 700px) { nav { flex-wrap:wrap; } .moment { flex-direction:column; } .frame, .frame img { width:140px; } .frame img { height:140px; } }
</style>
</head>
<body>
<header>
  <h1 id="title">Show dashboard</h1><span class="sub" id="subtitle"></span>
  <div class="chips" id="chips"></div>
  <nav id="tabs">
    <button data-tab="cull" class="on">Cull</button>
    <button data-tab="graded">Graded &amp; crops</button>
    <button data-tab="setup">Setup</button>
    <button data-tab="report">Report</button>
    <button data-tab="log">Cards &amp; log</button>
  </nav>
</header>
<main id="main"></main>

<div id="overlay">
  <div class="top"><span id="ovName"></span><span id="ovBadge" class="badge"></span><span class="sub" id="ovMeta"></span>
    <span style="flex:1"></span><span class="keys hint"><kbd>P</kbd> pick <kbd>A</kbd> alternate <kbd>X</kbd> reject <kbd>R</kbd> back to automatic <kbd>←</kbd><kbd>→</kbd> frames <kbd>↑</kbd><kbd>↓</kbd> moments <kbd>Esc</kbd> close</span>
    <button onclick="closeLoupe()">Close</button></div>
  <div class="stage"><img id="ovImg" alt=""></div>
</div>

<div id="crop">
  <div class="top" style="display:flex;gap:10px;align-items:center;padding:10px 16px;width:100%">
    <b id="cropName"></b><span class="sub">Drag the frame to move it, the corner to resize (it keeps the photo's shape).</span>
    <span style="flex:1"></span>
    <label>Level <input id="rot" type="range" min="-10" max="10" step="0.1" value="0" style="width:180px"> <span id="rotVal">0.0°</span></label>
    <button onclick="saveCrop(false)" class="primary">Save crop</button>
    <button onclick="saveCrop(true)">No crop</button>
    <button onclick="clearCrop()">Back to automatic</button>
    <button onclick="closeCrop()">Cancel</button>
  </div>
  <div id="cropbox"><img id="cropImg" alt=""><div id="rect"><div class="thirds"></div><div class="handle"></div></div></div>
</div>

<script>
const $ = (s, e = document) => e.querySelector(s);
let state = null, frames = [], byPath = {}, moments = [], tab = "cull", filter = "all", selected = null, runTimer = null;

async function api(path, body) {
  const response = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await response.json();
  if (!response.ok) { alert(data.error || "Something went wrong"); throw new Error(data.error); }
  return data;
}
const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const img = (kind, path) => `/img/${kind}?path=${encodeURIComponent(path)}`;

async function refresh() {
  state = await api("/api/state");
  const s = state.show;
  $("#title").textContent = s ? s.name : "No show today";
  $("#subtitle").textContent = s ? `${state.profile.name} · ${state.folder}` : "";
  const chips = [];
  if (s) {
    const st = state.status || {};
    if (st.cull) chips.push(`<span class="chip"><b>${st.cull.frames.toLocaleString()}</b> frames</span>`,
      `<span class="chip"><b>${st.cull.picks.toLocaleString()}</b> picks (${Math.round(st.cull.rate * 100)}%)</span>`,
      `<span class="chip"><b>${st.cull.rejects}</b> rejects</span>`);
    if (st.grade) chips.push(`<span class="chip"><b>${st.grade.graded}</b>/${st.grade.of} graded</span>`);
    for (const [size, n] of Object.entries(st.export || {})) chips.push(`<span class="chip">${esc(size)} <b>${n}</b></span>`);
    chips.push(`<span class="chip">${state.cards.length} card${state.cards.length == 1 ? "" : "s"} in</span>`);
    if (st["failures logged"]) chips.push(`<span class="chip" style="color:var(--reject)"><b>${st["failures logged"]}</b> failures</span>`);
    const p = state.progress;
    chips.push(state.running ? `<span class="chip running">● working: ${esc(p ? p.step + " " + p.text : "")}</span>`
                             : `<span class="chip">○ idle${p ? " · last: " + esc(p.step + " " + p.text) : ""}</span>`);
    chips.push(`<button onclick="runNow()">Run now</button>`, `<button onclick="api('/api/open', {what: 'delivery'})">Open delivery</button>`,
               `<button onclick="finishDay()">Finish the day</button>`);
  }
  $("#chips").innerHTML = chips.join("");
}

async function loadFrames() {
  if (!state || !state.show) { frames = []; moments = []; return; }
  frames = (await api("/api/frames")).frames;
  byPath = Object.fromEntries(frames.map(f => [f.path, f]));
  const groups = new Map();
  for (const f of frames) { if (!groups.has(f.moment)) groups.set(f.moment, []); groups.get(f.moment).push(f); }
  moments = [...groups.entries()].map(([id, members]) => ({id, members}));
}

function shown(f) {
  return filter == "all" || f.status == filter || (filter == "hand" && f.manual) || (filter == "differs" && f.manual && f.manual != f.auto);
}

function frameHTML(f, kind = "thumb") {
  return `<div class="frame ${f.status} ${selected == f.path ? "sel" : ""}" data-path="${esc(f.path)}">
    <img loading="lazy" src="${img(kind, f.path)}${kind == "graded" ? "&v=" + Date.now() : ""}" alt="">
    ${f.manual ? '<span class="hand">by hand</span>' : ""}${f.framing && (f.framing.crop || f.framing.rotate) ? '<span class="crop">cropped</span>' : ""}
    <div class="meta">${esc(f.name)} · ${Math.round(f.score)}${f.flags.length ? " · " + esc(f.flags.join(", ")) : ""}</div></div>`;
}

function renderStart() {
  $("#main").innerHTML = `<div class="panel"><h2>Start today's show</h2>
    <p class="hint">Cards inserted from now on are copied to this drive and taken through cull, grade and export automatically.</p>
    <div class="form">
      <label>Drive</label>${state.drives.length ? `<select id="fDrive">${state.drives.map(d => `<option>${esc(d)}</option>`).join("")}</select>`
        : `<span class="hint">Connect the show drive (it appears here), or type a folder: <input id="fDrive" placeholder="/Volumes/SHOWS"></span>`}
      <label>Show name</label><input id="fName" placeholder="Spring Classic">
      <label>Type</label><select id="fProfile">${state.profiles.map(p => `<option>${esc(p)}</option>`).join("")}</select>
      <label>Date</label><input id="fDate" type="date" value="${new Date().toISOString().slice(0, 10)}">
      <label>File names</label><input id="fNaming" placeholder="(your usual naming)">
      <span></span><button class="primary" onclick="startDay()">Start</button></div></div>`;
}

async function startDay() {
  await api("/api/start", {drive: $("#fDrive").value, name: $("#fName").value, profile: $("#fProfile").value,
                           date: $("#fDate").value, naming: $("#fNaming").value});
  await refresh(); await loadFrames(); render();
}
async function finishDay() { if (confirm("Finish the day? Cards inserted after this won't be copied.")) { await api("/api/finish", {}); await refresh(); render(); } }
async function runNow() { await api("/api/run", {}); refresh(); }

function renderCull() {
  if (!frames.length) { $("#main").innerHTML = `<div class="empty">No frames yet: insert a card.</div>`; return; }
  const count = k => frames.filter(f => k == "all" ? true : k == "hand" ? f.manual : f.status == k).length;
  const rate = state.status && state.status.cull ? Math.round(state.status.cull.rate * 100) : 40;
  const list = moments.map(m => {
    const visible = m.members.filter(shown);
    if (!visible.length) return "";
    const picked = m.members.filter(f => f.status == "pick").length;
    return `<div class="moment"><div class="label"><b>#${m.id}</b>${esc((m.members[0].captured || "").slice(11, 19))}<br>${picked} of ${m.members.length} picked</div>
      <div class="frames">${visible.map(f => frameHTML(f)).join("")}</div></div>`;
  }).join("");
  $("#main").innerHTML = `<div class="toolbar">
      ${["all", "pick", "alternate", "reject", "hand"].map(k => `<button class="${filter == k ? "on" : ""}" onclick="setFilter('${k}')">${{all: "All", pick: "Picks", alternate: "Alternates", reject: "Rejects", hand: "Changed by me"}[k]} (${count(k)})</button>`).join("")}
      <span class="sep"></span>Keep <input id="rate" type="number" min="5" max="95" value="${rate}" style="width:64px">%
      or <input id="count" type="number" min="1" placeholder="count" style="width:90px"> <button onclick="redial()">Re-dial</button>
      <span class="sep"></span><span class="keys hint">Click a frame, then <kbd>P</kbd> <kbd>A</kbd> <kbd>X</kbd> <kbd>R</kbd>; <kbd>Enter</kbd> opens it large</span>
    </div>${list}`;
}

function renderGraded() {
  const picks = frames.filter(f => f.status == "pick");
  if (!picks.length) { $("#main").innerHTML = `<div class="empty">No picks yet.</div>`; return; }
  $("#main").innerHTML = `<p class="hint">The graded picks, as delivered. Click one to crop or level it; it's graded and delivered again with the new framing.
    ${state.profile.auto_crop ? "Automatic crops are on for this show type." : "Automatic crops are off for this show type."}</p>
    <div class="grid">${picks.map(f => f.graded ? frameHTML(f, "graded") : `<div class="frame" data-path="${esc(f.path)}"><img src="${img("thumb", f.path)}"><div class="meta">${esc(f.name)} · not graded yet</div></div>`).join("")}</div>`;
}

function renderSetup() {
  const setup = state.setup, approved = state.show.settings;
  if (!setup) { $("#main").innerHTML = `<div class="empty">The setup sheet is made after the first card is culled.</div>`; return; }
  const describe = c => Object.entries(c.settings).map(([k, v]) => k == "raw.temperature" && v <= 0 ? "camera white balance" : `${k.replace("raw.", "")} ${v}`).join(", ") || "the preset as it is";
  $("#main").innerHTML = `<div class="panel"><h2>Approved</h2>${approved ? `<b>${esc(approved.approved)}</b> · ${esc(describe({settings: approved.default}))}${approved.by_lighting ? " (per lighting)" : ""} · ${esc(approved.at)}` : "Nothing approved yet."}</div>
    <div class="panel"><h2>Use for the whole show</h2>${Object.entries(setup.candidates).map(([k, c]) => `<button onclick="approve('${k}')">${k} · ${esc(c.name)}</button> <span class="hint">${esc(describe(c))}</span><br>`).join("")}
    <h2 style="margin-top:12px">Or per row (when the lighting changes)</h2>
    ${setup.frames.map(r => `Row ${r.row} (${esc((r.captured || "").slice(11, 16))}, EV ${r.ev}) <select data-row="${r.row}">${Object.keys(setup.candidates).map(k => `<option>${k}</option>`).join("")}</select><br>`).join("")}
    <button onclick="approveRows()">Approve per row</button></div>
    <img src="/img/setup?v=${Date.now()}" style="max-width:100%">`;
}

async function approve(choice) { await api("/api/approve", {choice}); await refresh(); render(); }
async function approveRows() {
  const choice = [...document.querySelectorAll("select[data-row]")].map(s => `${s.dataset.row}=${s.value}`).join(",");
  await api("/api/approve", {choice}); await refresh(); render();
}

async function renderReport() {
  const report = (await api("/api/report")).report;
  $("#main").innerHTML = `<div class="panel"><h2>Compare with your delivery</h2>
    <div class="form"><label>Exports folder</label><input id="dFolder" placeholder="/path/to/your Lightroom exports">
    <label>Learn from it</label><label><input id="dLearn" type="checkbox"> update this show type's profile</label>
    <span></span><button class="primary" onclick="compare()">Compare</button></div></div>
    <pre>${esc(report || "No comparison yet.")}</pre>`;
}
async function compare() {
  const result = await api("/api/compare", {delivered: $("#dFolder").value, learn: $("#dLearn").checked});
  $("pre").textContent = result.report;
}

function renderLog() {
  $("#main").innerHTML = `<div class="panel"><h2>Cards</h2>${state.cards.length ? state.cards.map(c => `${c.number}. ${esc(c.card)} · ${c.copied} copied${c.failed ? `, <b style="color:var(--reject)">${c.failed} failed</b>` : ""} · ${esc(c.at)}`).join("<br>") : "No cards yet."}</div>
    <div class="panel"><h2>Next</h2>${esc((state.status || {}).next || "")}</div>
    <div class="panel"><h2>Failures</h2><pre>${esc(state.failures.join("\n") || "None.")}</pre></div>`;
}

function render() {
  if (!state.show) return renderStart();
  ({cull: renderCull, graded: renderGraded, setup: renderSetup, report: renderReport, log: renderLog})[tab]();
}

function setFilter(k) { filter = k; renderCull(); }

async function redial() {
  const count = $("#count").value, rate = $("#rate").value;
  if (!confirm("Re-dial decides every frame's pick again at the new rate (your own changes stay). Delivered files of frames no longer picked are removed. Continue?")) return;
  await api("/api/redial", count ? {count} : {rate: rate + "%"});
  await refresh(); await loadFrames(); render();
}

async function setStatus(path, status) {
  const f = byPath[path];
  f.manual = status; f.status = status || f.auto || f.status;
  await api("/api/status", {changes: {[path]: status}, run: false});
  clearTimeout(runTimer);
  runTimer = setTimeout(() => api("/api/run", {}).then(refresh), 15000);  // let a run of changes settle first
  if ($("#overlay").classList.contains("on")) showLoupe(path); else render();
}

function visibleOrder() { return moments.flatMap(m => m.members.filter(shown)).map(f => f.path); }
function move(step) {
  const order = visibleOrder(); if (!order.length) return;
  const i = Math.max(0, Math.min(order.length - 1, order.indexOf(selected) + step));
  select(order[i]);
}
function moveMoment(step) {
  const i = moments.findIndex(m => m.members.some(f => f.path == selected));
  const next = moments[Math.max(0, Math.min(moments.length - 1, i + step))];
  if (next) select((next.members.find(shown) || next.members[0]).path);
}
function select(path) {
  selected = path;
  if ($("#overlay").classList.contains("on")) showLoupe(path);
  else { renderCull(); document.querySelector(`.frame[data-path="${CSS.escape(path)}"]`)?.scrollIntoView({block: "nearest"}); }
}

function showLoupe(path) {
  selected = path; const f = byPath[path];
  $("#overlay").classList.add("on");
  $("#ovImg").src = img("loupe", path);
  $("#ovName").textContent = f.name;
  $("#ovBadge").className = "badge " + f.status; $("#ovBadge").textContent = f.status + (f.manual ? " (by hand)" : "");
  $("#ovMeta").textContent = `moment #${f.moment} · ${(f.captured || "").slice(11, 19)} · score ${Math.round(f.score)} · sharpness ${f.sharpness?.toFixed(1) ?? "?"} · faces ${f.faces} · eyes ${f.eyes?.toFixed(2) ?? "–"}${f.flags.length ? " · " + f.flags.join(", ") : ""}`;
}
function closeLoupe() { $("#overlay").classList.remove("on"); render(); }

document.addEventListener("click", e => {
  const el = e.target.closest(".frame"); if (!el) return;
  const path = el.dataset.path;
  if (tab == "graded") return openCrop(path);
  if (selected == path) showLoupe(path); else select(path);
});
document.querySelectorAll("#tabs button").forEach(b => b.onclick = async () => {
  tab = b.dataset.tab; document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x == b));
  await loadFrames(); render();
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || $("#crop").classList.contains("on")) return;
  const keys = {ArrowRight: () => move(1), ArrowLeft: () => move(-1), ArrowDown: () => moveMoment(1), ArrowUp: () => moveMoment(-1),
    p: () => selected && setStatus(selected, "pick"), a: () => selected && setStatus(selected, "alternate"),
    x: () => selected && setStatus(selected, "reject"), r: () => selected && setStatus(selected, null),
    Enter: () => selected && showLoupe(selected), " ": () => selected && showLoupe(selected), Escape: closeLoupe};
  const action = keys[e.key] || keys[e.key.toLowerCase()];
  if (action && tab == "cull") { e.preventDefault(); action(); }
});

// Cropping: the frame keeps the photo's shape; leveling turns the photo and trims it to fill, as the export does.
let crop = null;
function inscribed(w, h, deg) {
  if (!deg) return 1; const a = Math.abs(deg) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return Math.min(w / (w * c + h * s), h / (w * s + h * c));
}
function openCrop(path) {
  const f = byPath[path]; const framing = f.framing || {};
  crop = {path, rotate: framing.rotate || 0, rect: framing.crop ? [...framing.crop] : [0, 0, 1, 1]};
  $("#cropName").textContent = f.name; $("#crop").classList.add("on");
  $("#rot").value = crop.rotate; $("#rotVal").textContent = crop.rotate.toFixed(1) + "°";
  const image = $("#cropImg"); image.onload = layoutCrop; image.src = img("loupe", path);
}
function layoutCrop() {
  const image = $("#cropImg"), w = image.naturalWidth, h = image.naturalHeight;
  const scale = Math.min(window.innerWidth * 0.92 / w, window.innerHeight * 0.8 / h);
  const box = $("#cropbox"); box.style.width = w * scale + "px"; box.style.height = h * scale + "px";
  const k = inscribed(w, h, crop.rotate);
  image.style.width = w * scale + "px"; image.style.height = h * scale + "px";
  image.style.transform = `translate(-50%, -50%) rotate(${-crop.rotate}deg) scale(${1 / k})`;
  const [x, y, cw, ch] = crop.rect, r = $("#rect");
  Object.assign(r.style, {left: x * w * scale + "px", top: y * h * scale + "px", width: cw * w * scale + "px", height: ch * h * scale + "px"});
}
$("#rot").oninput = e => { crop.rotate = parseFloat(e.target.value); $("#rotVal").textContent = crop.rotate.toFixed(1) + "°"; layoutCrop(); };
window.addEventListener("resize", () => crop && $("#crop").classList.contains("on") && layoutCrop());
(() => {
  let drag = null;
  $("#rect").addEventListener("pointerdown", e => {
    drag = {mode: e.target.classList.contains("handle") ? "size" : "move", x: e.clientX, y: e.clientY, rect: [...crop.rect]};
    e.target.setPointerCapture(e.pointerId);
  });
  const follow = e => {
    if (!drag) return;
    const box = $("#cropbox").getBoundingClientRect();
    const dx = (e.clientX - drag.x) / box.width, dy = (e.clientY - drag.y) / box.height;
    let [x, y, w, h] = drag.rect;
    if (drag.mode == "move") { x = Math.min(Math.max(0, x + dx), 1 - w); y = Math.min(Math.max(0, y + dy), 1 - h); }
    else { const size = Math.min(Math.max(0.3, w + Math.max(dx, dy)), 1 - x, 1 - y); w = h = size; }
    crop.rect = [x, y, w, h]; layoutCrop();
  };
  document.addEventListener("pointermove", follow);
  document.addEventListener("pointerup", e => { follow(e); drag = null; });  // the release point counts too
})();
async function saveCrop(none) {
  const whole = crop.rect[2] > 0.995 && crop.rect[3] > 0.995;
  await api("/api/framing", none ? {path: crop.path, crop: null, rotate: 0} : {path: crop.path, crop: whole ? null : crop.rect.map(v => +v.toFixed(5)), rotate: crop.rotate});
  closeCrop(); await loadFrames(); render();
}
async function clearCrop() { await api("/api/framing", {path: crop.path, clear: true}); closeCrop(); await loadFrames(); render(); }
function closeCrop() { $("#crop").classList.remove("on"); }

(async () => { await refresh(); await loadFrames(); render();
  setInterval(refresh, 5000);
  setInterval(async () => { if (tab != "cull" || !$("#overlay").classList.contains("on")) { const before = frames.length; await loadFrames(); if (frames.length != before && tab == "cull") render(); } }, 20000);
})();
</script>
</body>
